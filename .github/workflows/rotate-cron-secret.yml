name: Rotate cron secret

# Troca o segredo que o pg_cron usa para chamar uma Edge Function, sem passo
# manual: gera um valor novo no runner, grava como secret da função e atualiza
# o mesmo valor no Vault. O valor nunca é impresso (::add-mask::) nem sai do
# runner por outro caminho. Usa a Management API com SUPABASE_ACCESS_TOKEN.
#
# Durante alguns segundos entre as duas gravações o cron pode receber 401; o
# job roda de minuto em minuto e o processamento continua na rodada seguinte.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Qual segredo trocar"
        required: true
        type: choice
        options:
          - process-batch
          - account-deletion

permissions:
  contents: read

concurrency:
  group: rotate-cron-secret
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      TARGET: ${{ inputs.target }}
    steps:
      - name: Escolher nomes
        run: |
          case "$TARGET" in
            process-batch)
              echo "FUNCTION_SECRET=WORKER_CRON_SECRET" >> "$GITHUB_ENV"
              echo "VAULT_SECRET=process_batch_cron_secret" >> "$GITHUB_ENV" ;;
            account-deletion)
              echo "FUNCTION_SECRET=ACCOUNT_DELETION_CRON_SECRET" >> "$GITHUB_ENV"
              echo "VAULT_SECRET=account_deletion_cron_secret" >> "$GITHUB_ENV" ;;
            *) echo "alvo inválido" >&2; exit 1 ;;
          esac

      - name: Conferir que o Vault já tem o segredo
        run: |
          set -euo pipefail
          api="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}"
          # Nome vem da lista fixa do passo anterior.
          query=$(jq -n --arg n "$VAULT_SECRET" \
            '{query: ("select count(*)::int as n from vault.secrets where name = '"'"'" + $n + "'"'"'")}')
          count=$(curl -fsS -X POST "$api/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" -d "$query" | jq -r '.[0].n')
          if [ "$count" != "1" ]; then
            echo "O Vault não tem '$VAULT_SECRET'. Aplique a migration correspondente antes." >&2
            exit 1
          fi

      - name: Gerar, gravar na função e no Vault
        run: |
          set -euo pipefail
          api="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}"
          value=$(openssl rand -hex 32)
          echo "::add-mask::$value"

          jq -n --arg k "$FUNCTION_SECRET" --arg v "$value" '[{name: $k, value: $v}]' |
            curl -fsS -o /dev/null -X POST "$api/secrets" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" --data-binary @-

          # O valor é hexadecimal (sem aspas) e o nome vem da lista fixa acima.
          jq -n --arg n "$VAULT_SECRET" --arg v "$value" \
            '{query: ("select vault.update_secret((select id from vault.secrets where name = '"'"'" + $n + "'"'"'), '"'"'" + $v + "'"'"')")}' |
            curl -fsS -o /dev/null -X POST "$api/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" --data-binary @-
          echo "Segredo $FUNCTION_SECRET / $VAULT_SECRET trocado."
