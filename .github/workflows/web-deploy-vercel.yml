name: Deploy web (Vercel)

# Deploy manual (reserva). O deploy normal agora é feito pela integração Git da
# Vercel: cada push no main dispara um build com scripts/vercel-build.sh (ver
# vercel.json na raiz), sem precisar de token no GitHub. Este workflow só serve
# para publicar à mão um build feito no GitHub Actions; exige o secret
# VERCEL_TOKEN e as variáveis VERCEL_ORG_ID / VERCEL_PROJECT_ID.
on:
  workflow_dispatch: {}

permissions:
  contents: read

# Um deploy por vez; um push novo cancela o build anterior ainda em andamento.
concurrency:
  group: web-deploy-vercel
  cancel-in-progress: true

jobs:
  deploy:
    name: Build Flutter web e publicar na Vercel
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mistakemap-tau.vercel.app
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    defaults:
      run:
        working-directory: appmistakemap
    steps:
      - name: Verificar configuração da Vercel
        working-directory: .
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=0
          [ -n "$VERCEL_TOKEN" ] || { echo "::error::Falta o secret VERCEL_TOKEN (Settings → Secrets and variables → Actions)."; missing=1; }
          [ -n "$VERCEL_ORG_ID" ] || { echo "::error::Falta a variável VERCEL_ORG_ID."; missing=1; }
          [ -n "$VERCEL_PROJECT_ID" ] || { echo "::error::Falta a variável VERCEL_PROJECT_ID."; missing=1; }
          exit "$missing"

      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - run: flutter pub get

      - name: Build web (release)
        run: flutter build web --release

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Publicar na Vercel (produção)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url=$(npx --yes vercel@latest deploy build/web --prod --yes --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Versão web publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "- Produção: https://mistakemap-tau.vercel.app" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deploy: $url (acesso restrito à equipe da Vercel)" >> "$GITHUB_STEP_SUMMARY"
