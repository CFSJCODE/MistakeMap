name: Sync repository metadata

# O main é protegido: todo commit precisa dos 3 checks obrigatórios, então o
# workflow não pode mais publicar as cópias direto no branch. A cópia da raiz
# é atualizada no próprio PR, e este job só confere que as duas versões batem.
on:
  pull_request:
    paths:
      - ".github/LICENSE"
      - ".github/CITATION.cff"
      - "LICENSE"
      - "CITATION.cff"
      - ".github/workflows/sync-repository-metadata.yml"
  push:
    branches:
      - main
    paths:
      - ".github/LICENSE"
      - ".github/CITATION.cff"
      - "LICENSE"
      - "CITATION.cff"
      - ".github/workflows/sync-repository-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-repository-metadata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify GitHub root metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compare canonical metadata with root mirrors
        shell: bash
        run: |
          set -euo pipefail
          status=0
          for file in LICENSE CITATION.cff; do
            if ! cmp -s ".github/$file" "$file"; then
              echo "::error file=$file::$file está diferente de .github/$file. Rode: cp .github/$file $file"
              status=1
            fi
          done
          if [ "$status" -eq 0 ]; then
            echo "Repository metadata is synchronized."
          fi
          exit "$status"
