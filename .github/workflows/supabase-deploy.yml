name: Deploy Supabase migrations

on:
  push:
    branches:
      - main
    paths:
      - "appmistakemap/database/supabase/migrations/**"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: supabase-migrations-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: appmistakemap/database
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check migration content changes
        id: changes
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BEFORE_SHA"
          fi

          if git diff --quiet "$BEFORE_SHA" "$AFTER_SHA" -- appmistakemap/database/supabase/migrations; then
            echo "Migration files are unchanged; no database connection is needed."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            diff_status=$?
            if [[ "$diff_status" -ne 1 ]]; then
              exit "$diff_status"
            fi
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.changes.outputs.deploy == 'true'
        with:
          version: 2.116.0

      - name: Link project
        if: steps.changes.outputs.deploy == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Preview database migrations
        if: steps.changes.outputs.deploy == 'true'
        run: supabase db push --linked --dry-run --skip-vault
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push database migrations
        if: steps.changes.outputs.deploy == 'true'
        run: supabase db push --linked --skip-vault
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
