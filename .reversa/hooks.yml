# hooks.yml
# Ganchos opcionais executados antes ou depois dos skills forward do Reversa.
#
# Esquema por gancho:
#   command:     comando que será sugerido (optional: true) ou exigido (optional: false)
#   description: texto curto exibido ao usuário
#   enabled:     true | false. Sem esse campo, vale como true.
#   optional:    true (apresenta link clicável) | false (executa automaticamente e aguarda)
#
# Regras:
#   YAML inválido aqui é tolerado: o skill segue normalmente, apenas sem ganchos.
#   Não há DSL de condição neste arquivo. Se um gancho não deve rodar, use enabled: false.
#
# Por padrão, todos os ganchos chegam vazios. Adicione apenas os que fazem sentido para o seu projeto.

schema-version: 1

# Ganchos do /reversa-requirements
before-requirements: []
after-requirements: []

# Ganchos do /reversa-clarify
before-clarify: []
after-clarify: []

# Ganchos do /reversa-plan
before-plan: []
after-plan: []

# Ganchos do /reversa-to-do
before-to-do: []
after-to-do: []

# Ganchos do /reversa-audit
before-audit: []
after-audit: []

# Ganchos do /reversa-quality
before-quality: []
after-quality: []

# Ganchos do /reversa-coding
before-coding: []
after-coding:
  - command: "flutter analyze"
    description: "Verifica avisos Dart após a geração de código"
    enabled: true
    optional: false
  - command: "flutter test --reporter compact"
    description: "Roda a suite completa de testes após codificação"
    enabled: true
    optional: false

# Ganchos do /reversa-code-express
before-code-express: []
after-code-express:
  - command: "flutter analyze"
    description: "Análise estática após code-express"
    enabled: true
    optional: false

# Ganchos do /reversa-add
before-add: []
after-add:
  - command: "dart format lib/"
    description: "Formata o código após adicionar nova feature"
    enabled: true
    optional: true

# Ganchos do /reversa-sync
before-sync: []
after-sync:
  - command: "flutter test --reporter compact"
    description: "Valida testes após sincronização de specs"
    enabled: true
    optional: false

# Ganchos do /reversa-principles
before-principles: []
after-principles: []

# Ganchos do /reversa-quality
before-quality:
  - command: "flutter analyze"
    description: "Análise estática antes da auditoria de qualidade"
    enabled: true
    optional: true
after-quality: []

# Ganchos do /reversa-audit
before-audit: []
after-audit:
  - command: "flutter test --reporter compact"
    description: "Testes completos após auditoria"
    enabled: true
    optional: true
