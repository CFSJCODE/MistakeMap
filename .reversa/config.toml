# .reversa/config.toml — Configuração do Reversa para o MistakeMap

[project]
name = "MistakeMap"
language = "dart"
secondary_language = "rust"
framework = "flutter"
output_dir = "reversa/sdd"
forward_dir = "reversa/forward"
bugs_dir = "reversa/bugs"
docs_dir = "reversa/docs"

[engines]
primary = "claude-code"
entry_file = "CLAUDE.md"
skills_path = ".claude/skills"

[analysis]
# Pastas que o Scout deve mapear
include = [
  "appmistakemap/lib",
  "appmistakemap/test",
  "archive/worker/src",
]
exclude = [
  "archive/worker/target",
  ".dart_tool",
  "build",
  ".reversa",
  "reversa/sdd",
  "reversa/forward",
  "reversa/bugs",
  "reversa/docs",
]

[confidence]
confirmed = "🟢 CONFIRMED"
inferred  = "🟡 INFERRED"
gap       = "🔴 GAP"

[harness]
config_file = "harness.yaml"

[specs]
layout = "feature-folder"
granularity = "module"
custom_folders = []
scout_suggestion = "module"
decided_at = "2026-10-31T19:11:20Z"
